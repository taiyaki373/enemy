<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENEMY — 魔獣の防衛戦</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111019;color:#eee9e4;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;letter-spacing:4px;margin:8px 0}small,.sub{color:#a79fad}.tag{color:#ecab78;font-size:12px;letter-spacing:2px}canvas{width:100%;display:block;background:#191823;border:1px solid #403441;border-radius:12px;margin:18px 0;touch-action:none}.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{background:#25202e;color:#eee9e4;border:1px solid #5a4354;border-radius:10px;padding:16px;text-align:left;cursor:pointer;font:inherit}button:hover{background:#36283b}button:disabled{opacity:.5;cursor:default}button b{display:block;margin-bottom:6px}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:18px;font-size:13px;color:#aaa0b0}#restart{padding:8px 16px}#status{color:#f1bd8c} @media(max-width:600px){main{padding:12px}.skills{gap:6px}button{padding:10px;font-size:12px}.footer{flex-wrap:wrap}}
.arena{position:relative;margin:18px 0;border:1px solid #403441;border-radius:12px;overflow:hidden}.arena canvas{margin:0;border:0;border-radius:0;aspect-ratio:5/3}.hud{position:absolute;top:20px;left:22px;pointer-events:none;text-shadow:0 1px 5px #000}.hp{width:220px;height:8px;background:#171018;margin:8px 0}.hp i{display:block;height:100%;background:#e37c96;transition:width .1s}.view-label{position:absolute;bottom:16px;right:20px;color:#b4a7b8;font-size:11px;letter-spacing:2px;pointer-events:none}#result{position:absolute;inset:0;background:#110e18bb;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px}#result[hidden]{display:none}#result strong{font-size:clamp(18px,3vw,30px);color:#f3bd94}#result span{color:#d4cadb}@media(max-width:600px){.arena canvas{aspect-ratio:1/1}.hud{top:12px;left:12px}.hp{width:150px}}
.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:28px monospace;color:#fff0d7;text-shadow:0 0 5px #000;pointer-events:none}#look-hint{position:absolute;top:18px;right:18px;padding:8px 12px;background:#17111bbb;border-radius:6px;font-size:12px;pointer-events:none}#move-pad{display:none;position:absolute;bottom:28px;left:24px;width:100px;height:100px;border:1px solid #d7acb677;border-radius:50%;background:#251a2b88;touch-action:none;align-items:center;justify-content:center}#move-knob{width:38px;height:38px;border-radius:50%;background:#e3adbc99;pointer-events:none}@media(pointer:coarse){#move-pad{display:flex}#look-hint{display:none}}
#enemy-health{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:18px}.enemy-hp-card{padding:10px 12px;background:#211c29;border:1px solid #403441;border-radius:8px}.enemy-hp-label{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}.enemy-hp-label b{color:var(--enemy-color)}.enemy-hp-value{color:#d9d1dd;font-variant-numeric:tabular-nums;font-size:11px}.enemy-hp-track{height:6px;background:#100e17;margin-top:8px;overflow:hidden;border-radius:3px}.enemy-hp-track i{display:block;height:100%;background:var(--enemy-color);transition:width .1s}.enemy-hp-card.defeated{opacity:.45}@media(max-width:600px){#enemy-health{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.enemy-hp-card{padding:8px}}
#hit-feedback{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);padding:9px 16px;border-radius:8px;background:#1a1228bb;color:#a9f0bb;font-size:14px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 4px #000}#hit-feedback.critical{color:#ffdc78;font-weight:bold}@media(max-width:600px){#hit-feedback{font-size:11px;padding:7px;bottom:28%}}
</style>
<main>
<header><div><div class="tag">MONSTER SIDE / FPS PvE · 絶望</div><h1>魔獣の防衛戦</h1><small>あなたはモンスター。圧倒的な5人の冒険者から領域を守れ。</small></div><button id="restart">再挑戦</button></header>
<div id="enemy-health" aria-label="冒険者5人のHP"><div class="enemy-hp-card" style="--enemy-color:#78bdde"><div class="enemy-hp-label"><b>剣士</b><span class="enemy-hp-value"></span></div><div class="enemy-hp-track" role="progressbar" aria-label="剣士のHP"><i></i></div></div><div class="enemy-hp-card" style="--enemy-color:#e4be78"><div class="enemy-hp-label"><b>弓使い</b><span class="enemy-hp-value"></span></div><div class="enemy-hp-track" role="progressbar" aria-label="弓使いのHP"><i></i></div></div><div class="enemy-hp-card" style="--enemy-color:#b8a0ee"><div class="enemy-hp-label"><b>魔術師</b><span class="enemy-hp-value"></span></div><div class="enemy-hp-track" role="progressbar" aria-label="魔術師のHP"><i></i></div></div><div class="enemy-hp-card" style="--enemy-color:#8bd3ad"><div class="enemy-hp-label"><b>僧侶</b><span class="enemy-hp-value"></span></div><div class="enemy-hp-track" role="progressbar" aria-label="僧侶のHP"><i></i></div></div><div class="enemy-hp-card" style="--enemy-color:#d7a66d"><div class="enemy-hp-label"><b>重装タンク</b><span class="enemy-hp-value"></span></div><div class="enemy-hp-track" role="progressbar" aria-label="重装タンクのHP"><i></i></div></div></div>
<div class="arena"><canvas id="game" width="1000" height="600" aria-label="モンスターの一人称視点で戦う3Dアリーナ"></canvas><div id="hit-feedback" hidden></div><div class="crosshair" aria-hidden="true">+</div><div id="look-hint">クリックで突進＆視点操作 · Escで解除</div><div id="move-pad" aria-label="移動スティック"><div id="move-knob"></div></div><div class="hud"><b>あなた / 魔獣</b><div class="hp"><i id="hp-fill"></i></div><small id="hp-text"></small></div><div id="result" hidden><strong id="result-text"></strong><span>「再挑戦」で新しい戦闘を開始</span></div><div class="view-label">FIRST PERSON · 魔獣の領域</div></div>
<div class="skills"><button id="dash"><b>左クリック · 突進</b><span>威力120〜170 · 5%クリティカル · 7%吸収</span></button><button id="blast"><b>Q · 遠隔範囲攻撃</b><span>範囲半径3倍 · 爆風で障害物を倒壊</span></button><button id="summon"><b>右クリック · 雑魚召喚</b><span>頑丈な眷属5体 · CT 2秒</span></button></div>
<div class="footer"><span>移動：WASD / 矢印キー · 視点：クリック後にマウス · 左クリック：突進 · 右クリック：召喚 · Q：範囲攻撃 · Esc：視点操作解除<br>タッチ：左スティックで移動、画面ドラッグで視点、ボタンで技</span><span id="status"></span></div>
</main>
<script src="vendor/three.min.js"></script>
<script src="world.js"></script>
<script src="renderer.js"></script>
<script src="game.js"></script>
</html>
